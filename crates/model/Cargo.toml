[package]
name = "model"
version = "0.0.0"
description = "Ziqpu local-model benchmark + fetch: pick and pull a local LLM sized to the machine."
publish = false
edition.workspace = true
# rust-version intentionally omitted (like the ui crate): sysinfo's MSRV is above the workspace 1.80
# pin, and gating this crate would falsely fail cargo version checks. The logic itself is 1.80-clean.
authors.workspace = true
repository.workspace = true
license-file.workspace = true

[lib]
name = "model"
path = "src/lib.rs"

[[bin]]
name = "ziqpu-model"
path = "src/main.rs"

[dependencies]
# Only `detect_spec` touches this — the tier logic below is dependency-free and unit-tested.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Parse the Hugging Face Hub API response for layer 2. The parser is pure + unit-tested against a
# fixture; the HTTP is in-process (see below).
serde_json = "1"
# In-process HTTPS, replacing five `curl` subprocesses. Same crate, same features as `crates/agents`
# already uses — pure-Rust rustls with bundled Mozilla roots, no OpenSSL, no OS cert store, and no
# dependency on a `curl` binary the app does not ship. This crate's doc comments used to call the
# subprocess "the repo's no-HTTP-crate convention"; that convention ended when agents moved to ureq,
# and this is the crate catching up rather than a new dependency entering the tree.
ureq = { version = "2", default-features = false, features = ["tls"] }
# A hard timeout on the GPU-probe subprocesses (nvidia-smi can hang on a wedged driver). Tiny,
# MIT/Apache-licensed, no transitive weight beyond libc/winapi already in the tree.
wait-timeout = "0.2"
# Verify the downloaded llama.cpp runtime against a digest shipped in this binary, before it is
# extracted or executed. Pure Rust, MIT/Apache-2.0, and already in the tree transitively — so it
# adds no new licence surface to the permissive-only allowlist `cargo deny` enforces.
sha2 = "0.10"
