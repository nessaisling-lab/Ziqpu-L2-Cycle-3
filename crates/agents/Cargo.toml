[package]
name = "agents"
version = "0.0.0"
description = "Ziqpu agents: the two-vizier observe→decide→act loop, human checkpoint, and grounded tool."
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true

[[bin]]
name = "ziqpu-agent"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
ephemeris = { path = "../ephemeris" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS for the live interpreter paths (Anthropic + OpenAI-compatible/OpenRouter). Pure-Rust rustls
# TLS with bundled Mozilla roots — no OpenSSL, no OS cert store, no `curl.exe` dependency — so it is a
# guaranteed cross-platform build/run (Windows/macOS/Linux). Crucially the API key is set as an
# in-process header and never appears on a process command line (the old curl `-H` argv leak).
ureq = { version = "2", default-features = false, features = ["tls"] }

# --- optional: reading a code with the camera (`--features camera`) ---
# Both Apache-2.0, so the permissive-only tree that protects the commercial path is unaffected.
#
# OFF BY DEFAULT, deliberately. `nokhwa` links the platform capture SDK (MediaFoundation /
# AVFoundation / V4L2), which is weight the shipping build should only carry once the feature is
# actually wired to a UI — and weight the 3-OS CI matrix should not carry by accident. Everything
# below the camera (decoding, and the GS1 parsing it feeds) stays in the default build and is tested
# there, so only the capture edge is gated.
# Only the decoders and the symbologies a product code actually uses. rxing's defaults also pull
# image loading, SVG, encoders and a URI/regex client stack, none of which a live camera frame needs.
rxing = { version = "0.9", optional = true, default-features = false, features = [
    "decoders",
    # Free: rxing declares `encoders = []`, so this adds no crates. It buys a round-trip test —
    # encode a known payload with rxing's own writer, render it, decode it back — which proves the
    # luma path without hand-writing a symbology's module table from memory.
    "encoders",
    # rxing requires a character-set backend; this is the one its own defaults use, and its
    # licences (Apache-2.0/MIT/BSD-3-Clause) are already on the allowlist.
    "encoding_rs",
    "qrcode",
    "datamatrix",
    "oned",
] }
# `default-features = false` is load-bearing, not tidiness. nokhwa's default `decoding` feature pulls
# `nokhwa-core/mjpeg` → `mozjpeg-sys`, which is licensed **IJG** — not on this repo's allowlist, and
# `cargo deny` rightly fails the build for it. Dropping it also happens to be the better engineering
# choice here: without the JPEG path we ask the camera for an uncompressed frame and read its luma
# plane directly, which is exactly what a barcode decoder wants and skips a decode round-trip.
nokhwa = { version = "0.10", optional = true, default-features = false, features = [
    "input-native",
] }

[features]
default = []
# Read a GS1 code from a webcam. See `agents::camera`.
camera = ["dep:rxing", "dep:nokhwa"]
