title = "Ziqpu gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated public data — not secrets."
# The `ziqpu_dev` regex was removed with the Postgres dev container it belonged to. A scanner
# allowlist naming a credential that no longer exists is a standing permission for a string
# nobody is checking any more.
paths = [
  '''Cargo\.lock''',                # dependency checksums, not secrets
  '''(^|/)target/''',               # build artifacts
  '''company_metadata\.csv''',      # gitignored raw export
  '''crates/geo/data/cities\.bin''', # generated public GeoNames gazetteer (CC BY 4.0), not secrets
]
